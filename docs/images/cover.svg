<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Find the Cats</title>
  <desc id="description">A graphite cat on ivory paper. Ten places. Sixty cats. Take your time. Paris, Venice, Kyoto, Lisbon, Istanbul, Amsterdam, Prague, Chefchaouen, Havana, and Seoul.</desc>
  <path fill="#f5f0e6" d="M0 0h1200v300H0z"/>
  <g transform="translate(60 56) scale(4.5)" fill="none" stroke="#53634e" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 11 4 3l6 4a10 10 0 0 1 4 0l6-4-.5 8c1 1.3 1.5 2.5 1.5 4 0 4-4 6-9 6s-9-2-9-6c0-1.5.5-2.7 1.5-4Z"/>
    <path d="M8 13h.01M16 13h.01M11 16h2l-1 1-1-1ZM2 14l4 1M2 18l4-1M22 14l-4 1M22 18l-4-1"/>
  </g>
  <text x="214" y="112" fill="#484738" font-family="Georgia, serif" font-size="56" letter-spacing="-1.4">Find the Cats</text>
  <text x="217" y="156" fill="#716c5e" font-family="Verdana, sans-serif" font-size="20">Ten places. Sixty cats. Take your time.</text>
  <path d="M60 194h1080" fill="none" stroke="#d9d3c6"/>
  <text x="60" y="234" fill="#53634e" font-family="Verdana, sans-serif" font-size="15" letter-spacing="1.5">PARIS  /  VENICE  /  KYOTO  /  LISBON  /  ISTANBUL</text>
  <text x="60" y="266" fill="#53634e" font-family="Verdana, sans-serif" font-size="15" letter-spacing="1.5">AMSTERDAM  /  PRAGUE  /  CHEFCHAOUEN  /  HAVANA  /  SEOUL</text>
</svg>
