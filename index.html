<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta name="description" content="A quiet little journey. Explore pencil drawings of Paris, Venice, and Kyoto, and find the six cats hiding in every picture." />
    <title>Find the Cats</title>
    <script>
      // A rewrite preserves the slashless URL; resolve assets inside its mount.
      if (window.location.pathname === '/find-cats') {
        const base = document.createElement('base')
        base.href = '/find-cats/'
        document.head.append(base)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
